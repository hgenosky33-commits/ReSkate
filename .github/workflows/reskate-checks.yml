name: ReSkate checks

on:
  pull_request:
    branches: [reskate-2.0.7]
  push:
    branches: [reskate-2.0.7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reskate-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: Windows regression tests
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify build tools
        shell: pwsh
        run: ./dev.ps1 Doctor
      - name: Compile and run regression tests
        shell: pwsh
        run: ./dev.ps1 Check -Jobs 2
